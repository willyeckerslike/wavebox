<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wavebox</title>
  <meta name="description" content="Private, local music player.">
  <meta name="theme-color" content="#ED6849">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Wavebox</h1>
    <span class="privacy-badge">100% LOCAL</span>
  </header>

  <main>
    <!-- Visualizer -->
    <div id="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <!-- Now Playing -->
    <section class="now-playing">
      <h2 class="track-title" id="track-title">No track selected</h2>
      <p class="track-meta" id="track-meta">Select files to begin</p>
    </section>

    <!-- Controls -->
    <section class="controls">
      <input type="range" class="seek-bar" id="seek-bar" value="0" max="100" step="0.1" aria-label="Seek">
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
      
      <div class="playback-controls">
        <button class="btn skip-btn" id="prev-btn" aria-label="Previous track">⏮</button>
        <button class="btn play-btn" id="play-btn" aria-label="Play or Pause">▶</button>
        <button class="btn skip-btn" id="next-btn" aria-label="Next track">⏭</button>
      </div>
      
      <input type="range" class="seek-bar" id="volume-bar" value="1" min="0" max="1" step="0.01" aria-label="Volume" style="max-width: 200px; margin: 0 auto;">
    </section>

    <!-- File Input & Playlist -->
    <section class="playlist-section">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <div>
          <button class="btn btn-secondary" id="add-files-btn">Add Files</button>
          <button class="btn btn-secondary" id="clear-btn" style="background: var(--paper);">Clear</button>
        </div>
      </div>
      <input type="file" id="file-input" multiple accept="audio/*" style="display: none;">
      <div class="playlist-items" id="playlist-items">
        <!-- Tracks injected here -->
      </div>
      
      <!-- FLAC Warning / Reselect Prompt -->
      <div id="restore-prompt" style="display: none; margin-top: 16px; text-align: center;">
        <p style="font-family: var(--font-mono); font-size: 0.85rem; margin-bottom: 12px;">Browser security cleared file access. Please reselect your files to restore playback.</p>
        <button class="btn btn-primary" id="reselect-btn">Reselect Files</button>
      </div>
    </section>
  </main>

  <audio id="audio-player" crossorigin="anonymous"></audio>
  <script src="app.js"></script>
</body>
</html>
